<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732.5410261596455 619.4026188798808" width="732.5410261596455" height="619.4026188798808"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }
      @font-face { font-family: Nunito; src: url(data:font/woff2;base64,); }</style></defs><rect x="0" y="0" width="732.5410261596455" height="619.4026188798808" fill="#121212"></rect><g transform="translate(10 10) rotate(0 356.27051307982276 35.16292600951792)"><text x="0" y="49.56566050301647" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="56.26068161522868px" fill="#ff8383" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">What is constructor in js </text></g><g transform="translate(46.79998779296875 132.40000915527344) rotate(0 296.00000000000006 27.75)"><text x="0" y="13.038800000000007" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="14.800000000000008px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A constructor is a special function used to create and initialize objects. When</text><text x="0" y="31.538800000000016" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="14.800000000000008px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">you call it with the new keyword, it builds a fresh object and sets it up with the</text><text x="0" y="50.03880000000003" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="14.800000000000008px" fill="#d3d3d3" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">values you give it.</text></g><g stroke-linecap="round" transform="translate(124.53030591971833 198.52500608168916) rotate(359.92323174790147 201.59840487961606 205.30384188655694)"><path d="M32 0 C166.34 -0.27, 300.32 0.2, 371.2 0 M32 0 C121.01 0.11, 210.78 -0.3, 371.2 0 M371.2 0 C390.58 0.93, 401.97 10.25, 403.2 32 M371.2 0 C390.72 -1.4, 403.06 9.77, 403.2 32 M403.2 32 C400.53 135.04, 400.36 239.27, 403.2 378.61 M403.2 32 C403.1 143.38, 403.41 253.92, 403.2 378.61 M403.2 378.61 C403.44 399.79, 394.29 411.52, 371.2 410.61 M403.2 378.61 C403.75 401.4, 391.32 412.39, 371.2 410.61 M371.2 410.61 C261.72 410.97, 152.97 411.8, 32 410.61 M371.2 410.61 C267.58 409.5, 164.83 409.92, 32 410.61 M32 410.61 C11.08 412.49, -0.98 399.5, 0 378.61 M32 410.61 C11.45 410.13, 2.1 400.29, 0 378.61 M0 378.61 C1.86 303.06, 0.19 227.94, 0 32 M0 378.61 C-1.13 306.17, -1.59 233.28, 0 32 M0 32 C0.71 12.19, 10.26 1.78, 32 0 M0 32 C-0.4 9.53, 12.38 -1.12, 32 0" stroke="#b595ff" stroke-width="2" fill="none"></path></g><g transform="translate(129.53032302695635 228.85438384700257) rotate(359.92323174790147 177.53976440429688 174.99999999999997)"><text x="0" y="19.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">class User {</text><text x="0" y="44.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  constructor(name, role) {</text><text x="0" y="69.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    this.name = name;</text><text x="0" y="94.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    this.role = role;</text><text x="0" y="119.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  }</text><text x="0" y="144.07999999999998" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="169.07999999999998" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  greet() {</text><text x="0" y="194.07999999999998" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    return `Hi, I'm ${this.name}`;</text><text x="0" y="219.07999999999998" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  }</text><text x="0" y="244.07999999999998" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">}</text><text x="0" y="269.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"></text><text x="0" y="294.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">const u1 = new User("Asha", "admin");</text><text x="0" y="319.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">console.log(u1.name);    // "Asha"</text><text x="0" y="344.08" font-family="Nunito, sans-serif, Segoe UI Emoji" font-size="20px" fill="#b595ff" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">console.log(u1.greet()); // "Hi, I'm Asha"</text></g></svg>